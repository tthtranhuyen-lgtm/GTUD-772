    <script>
      // Guard against iframe script injection trying to set window.fetch when it has only a getter
      try {
        let _activeFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function() {
            return _activeFetch;
          },
          set: function(newFetch) {
            _activeFetch = newFetch;
          },
          configurable: true,
          enumerable: true
        });
      } catch (err) {
        // Fallback if redefine fails
      }
    </script>
